<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Fondo -->
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">Capa: "Barrios" — Ciudad X (ficticia)</text>
  <text x="20" y="50" font-size="13" fill="#555">4 entidades geográficas (polígonos) de la misma capa</text>

  <!-- Marco del mapa -->
  <rect x="40" y="70" width="460" height="400" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>

  <!-- Barrio 1: El Roble -->
  <polygon points="60,90 250,80 270,250 60,260" fill="#a9d6e5" stroke="#2b6a80" stroke-width="2"/>
  <text x="130" y="175" font-size="15" font-weight="bold" fill="#1a3d4d">El Roble</text>

  <!-- Barrio 2: Los Pinos -->
  <polygon points="270,80 480,90 470,250 270,250" fill="#b5e2b5" stroke="#2f7a2f" stroke-width="2"/>
  <text x="340" y="175" font-size="15" font-weight="bold" fill="#1f4d1f">Los Pinos</text>

  <!-- Barrio 3: La Esperanza (destacado) -->
  <polygon points="60,260 270,250 260,440 60,430" fill="#f5e08c" stroke="#a6821a" stroke-width="3"/>
  <text x="110" y="350" font-size="15" font-weight="bold" fill="#5c4a0e">La Esperanza</text>

  <!-- Barrio 4: San Judas -->
  <polygon points="270,250 470,250 480,440 260,440" fill="#f2b6a0" stroke="#a8442a" stroke-width="2"/>
  <text x="330" y="350" font-size="15" font-weight="bold" fill="#6b2314">San Judas</text>

  <!-- Coordenada: vertice de La Esperanza -->
  <circle cx="260" cy="440" r="6" fill="#d62828" stroke="#fff" stroke-width="1.5"/>
  <text x="215" y="465" font-size="12" fill="#d62828" font-weight="bold">Coordenada de un vértice</text>
  <text x="215" y="480" font-size="12" fill="#d62828">Lat: 5.0703, Long: -75.5138 (WGS84)</text>

  <!-- Linea punteada hacia el callout de atributos -->
  <line x1="160" y1="340" x2="560" y2="200" stroke="#a6821a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Callout de atributos (tabla de atributos de UNA entidad) -->
  <rect x="560" y="140" width="230" height="140" fill="#fffdf3" stroke="#a6821a" stroke-width="2" rx="6"/>
  <text x="575" y="165" font-size="14" font-weight="bold" fill="#5c4a0e">Atributos — "La Esperanza"</text>
  <line x1="560" y1="175" x2="790" y2="175" stroke="#a6821a" stroke-width="1"/>
  <text x="575" y="198" font-size="13" fill="#333">Nombre: La Esperanza</text>
  <text x="575" y="221" font-size="13" fill="#333">Población: 8.500 hab.</text>
  <text x="575" y="244" font-size="13" fill="#333">Área: 1.2 km²</text>
  <text x="575" y="267" font-size="13" fill="#333">Tipo: Residencial</text>

  <!-- Nota inferior -->
  <text x="40" y="500" font-size="12" fill="#555">La capa "Barrios" agrupa las 4 entidades (polígonos). Cada una tiene sus propios</text>
  <text x="40" y="518" font-size="12" fill="#555">atributos en la tabla de atributos; aquí se muestran solo los de "La Esperanza" como ejemplo.</text>
  <text x="40" y="536" font-size="12" fill="#555">Cada polígono está definido, en el fondo, por coordenadas (ej. el vértice marcado en rojo).</text>
</svg>
